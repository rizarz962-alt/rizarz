/* ================= FITUR BARU v2 =================
 * Backend: Supabase (Database + Storage + Auth). ISI dua nilai di bawah. Jalankan supabase_setup.sql di SQL Editor.
 * anon key memang boleh publik (dilindungi RLS). JANGAN PERNAH menaruh service_role key di file ini.
 * Selama SB.url / SB.key kosong, fitur global (foto, playlist permanen, pengajuan lagu, rating) dinonaktifkan dan
 * ditandai jelas di UI — tidak ada klaim palsu bahwa data tersimpan global. */
const SB={url:'',key:''};
const SBOK=()=>!!(SB.url&&SB.key);
let SBT=sessionStorage.getItem('sbt')||'',SBR=sessionStorage.getItem('sbr')||'';
const sbAdm=()=>SBOK()&&!!SBT&&isA();
const sbOut=()=>{SBT=SBR='';sessionStorage.removeItem('sbt');sessionStorage.removeItem('sbr')};
async function sbRef(){try{const r=await fetch(SB.url+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:SB.key,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:SBR})});const j=await r.json();if(!r.ok)throw 0;SBT=j.access_token;SBR=j.refresh_token;sessionStorage.setItem('sbt',SBT);sessionStorage.setItem('sbr',SBR);return true}catch(e){sbOut();abtn();return false}}
async function sb(path,o){o=o||{};const run=()=>fetch(SB.url+path,{method:o.m||'GET',headers:Object.assign({apikey:SB.key,Authorization:'Bearer '+(SBT||SB.key)},o.h||{},o.j!==undefined?{'Content-Type':'application/json'}:{}),body:o.j!==undefined?JSON.stringify(o.j):o.b});
 let r=await run();if(r.status===401&&SBR&&SBT&&await sbRef())r=await run();
 if(!r.ok){let m='';try{const j=await r.json();m=j.message||j.error||''}catch(e){}throw Error(m||'HTTP '+r.status)}
 const t=await r.text();return t?JSON.parse(t):null}
