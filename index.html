body{font:15px/1.5 system-ui,-apple-system,sans-serif;color:var(--tx);background:linear-gradient(135deg,#5b2bd6,#8a3df0,#3a1d9a);background-size:200% 200%;animation:bg 18s ease infinite;min-height:100vh;overflow-x:hidden}

button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
#shell{display:flex;margin:12px;border-radius:24px;background:var(--bg);min-height:calc(100vh - 24px);border:1px solid var(--bd);overflow:hidden;box-shadow:0 20px 60px #0008}
#sb{width:232px;flex:none;padding:16px;background:var(--pn);transition:.3s;position:sticky;top:0;align-self:flex-start;height:calc(100vh - 24px);overflow:auto;z-index:30}
#sb.mini{width:72px}#sb.mini .tx{display:none}
.brand{display:flex;gap:10px;align-items:center;margin-bottom:18px;font-weight:800}
.lg{width:40px;height:40px;object-fit:contain;padding:7px;border-radius:12px;background:linear-gradient(135deg,var(--pu),var(--bl));flex:none}
#sb nav button{display:flex;gap:12px;align-items:center;width:100%;padding:11px 12px;margin:3px 0;border-radius:12px;color:var(--mu);text-align:left;transition:.2s;white-space:nowrap}
#sb nav button:hover{background:var(--p2);color:var(--tx);transform:translateX(3px)}
#sb nav button.on{background:linear-gradient(90deg,var(--pu),var(--bl));color:#fff;box-shadow:0 6px 20px #7c4dff66}
#app{flex:1;min-width:0}
header{position:sticky;top:0;z-index:20;display:flex;gap:10px;align-items:center;padding:10px 16px;background:#0b0a1fcc;backdrop-filter:blur(12px);border-bottom:1px solid var(--bd)}
body.light header{background:#f1eeffcc}
header .nm{font-weight:800;letter-spacing:.5px;white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;background:var(--li);box-shadow:0 0 10px var(--li)}
.ib{width:40px;height:40px;border-radius:12px;background:var(--p2);flex:none}
.sp{flex:1}#nt{font-variant-numeric:tabular-nums;font-weight:700;color:var(--cy)}#nd{font-size:12px;color:var(--mu)}
#mb2{display:none}
#main{padding:20px 20px 190px}#main>*{animation:up .5s both}
@keyframes up{from{opacity:0;transform:translateY(14px)}}
.hd{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.bt{display:inline-flex;align-items:center;gap:6px;padding:11px 18px;border-radius:14px;background:var(--p2);border:1px solid var(--bd);font-weight:600;text-decoration:none;color:var(--tx);transition:.2s}
.bt:hover{transform:translateY(-2px);box-shadow:0 8px 22px #7c4dff55}
.bt.p{background:linear-gradient(90deg,var(--pu),var(--bl));color:#fff;border:0}.bt.d{background:#e11d4833}
.in{padding:11px 14px;border-radius:12px;background:var(--p2);border:1px solid var(--bd);width:100%;max-width:100%;margin:4px 0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.hero{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:34px;border-radius:26px;background:linear-gradient(120deg,#5b2bd6,#8b46ff 60%,#3b6cff);color:#fff;min-height:290px;box-shadow:0 20px 50px #7c4dff55}
.hero h1{font-size:clamp(26px,5vw,46px);line-height:1.1;margin:6px 0}.hero h2{font-weight:500;font-size:clamp(15px,2.4vw,20px);margin-bottom:8px}
.hero p{max-width:520px;opacity:.9;margin-bottom:16px}.ch{font-size:12px;letter-spacing:2px;font-weight:700;color:var(--li)}
.hl{width:170px;height:170px;object-fit:contain;padding:36px;border-radius:40px;background:#ffffff1f;backdrop-filter:blur(8px);animation:fl 5s ease-in-out infinite;flex:none;box-shadow:0 0 60px #22d3ee66}
.orb{position:absolute;right:-60px;top:-60px;width:260px;height:260px;border-radius:50%;background:radial-gradient(#22d3ee66,transparent 70%);animation:fl 7s infinite}
.orb.b{left:30%;top:auto;bottom:-110px;right:auto;background:radial-gradient(#ff5fa255,transparent 70%)}
@keyframes fl{50%{transform:translateY(-14px)}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin-top:18px}
.cd2{position:relative;padding:20px;border-radius:22px;background:var(--pn);border:1px solid var(--bd);transition:.25s;display:flex;flex-direction:column;gap:6px;overflow:hidden}
.cd2:nth-child(3n+1){background:linear-gradient(145deg,#5b2bd6,#3b2a9c);color:#fff}.cd2:nth-child(3n+2){background:linear-gradient(145deg,#2f5bff,#2a2f8f);color:#fff}
.cd2:hover{transform:translateY(-6px);box-shadow:0 14px 34px #7c4dff77}.cd2 .e{font-size:34px}.cd2 p{font-size:13px;opacity:.85;flex:1}.cd2 .bt{align-self:flex-start;padding:8px 14px;margin-top:6px}
.pn{padding:18px;border-radius:20px;background:var(--pn);border:1px solid var(--bd);margin-bottom:14px}
.gal{columns:200px;gap:12px}
.ph,.vc{position:relative;break-inside:avoid;margin-bottom:12px;border-radius:16px;overflow:hidden;background:var(--pn);border:1px solid var(--bd);cursor:pointer;transition:.25s}
.ph:hover,.vc:hover{transform:scale(1.02);box-shadow:0 10px 28px #7c4dff66}
.ph img,.vc img{display:block;width:100%;min-height:80px;object-fit:cover}.ph figcaption,.vc .vi{padding:9px 12px;font-size:13px}small{color:var(--mu);display:block}
.ad{position:absolute;top:6px;right:6px;display:flex;gap:4px}.ad button{width:32px;height:32px;border-radius:9px;background:#000a}
.vg{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}.vc img{aspect-ratio:16/9;background:#000}.vc .th0{aspect-ratio:16/9;display:grid;place-items:center;font-size:40px;background:var(--p2)}
.mo{position:fixed;inset:0;z-index:100;background:#000b;display:grid;place-items:center;padding:12px;animation:fi .25s}@keyframes fi{from{opacity:0}}
.md{position:relative;width:min(560px,100%);max-height:92vh;overflow:auto;padding:22px;border-radius:22px;background:var(--pn);border:1px solid var(--bd);animation:up .3s}.md.w{width:min(960px,100%)}
.md .x{position:absolute;right:12px;top:12px;width:36px;height:36px;border-radius:10px;background:var(--p2);z-index:2}.md h3{margin-bottom:10px;padding-right:40px}
.md img.big{width:100%;max-height:68vh;object-fit:contain;transition:transform .2s}.md video,.md iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:12px;background:#000}
.clk{font-variant-numeric:tabular-nums;font-weight:800}.zs{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.zc{padding:18px;border-radius:20px;background:var(--pn);border:1px solid var(--bd);text-align:center}.zc .clk{font-size:30px}.zc.m{grid-column:1/-1;background:linear-gradient(135deg,#5b2bd6,#3b6cff);color:#fff}.zc.m .clk{font-size:clamp(40px,10vw,76px)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}.cd{aspect-ratio:1;border-radius:12px;background:var(--p2);position:relative}.cd.td{background:linear-gradient(135deg,var(--pu),var(--cy));color:#fff;font-weight:800}.cd.ev::after{content:"";position:absolute;bottom:5px;left:50%;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--pk)}
.q{font-size:clamp(18px,3vw,26px);font-weight:600;line-height:1.4}.chip{display:inline-block;padding:3px 10px;border-radius:99px;background:var(--p2);font-size:12px;color:var(--cy)}
.bars{display:flex;gap:14px;align-items:flex-end;height:170px}.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:12px}.bars i{width:100%;border-radius:10px 10px 0 0;background:linear-gradient(var(--cy),var(--pu));transition:height .8s;min-height:3px}
.ln{display:flex;gap:10px;align-items:center;padding:8px;border-radius:12px;cursor:pointer}.ln:hover,.ln.on{background:var(--p2)}.ln img{width:44px;height:44px;border-radius:10px;object-fit:cover}.ln div{flex:1;min-width:0}.ln b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#pl{position:fixed;z-index:50;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));width:min(980px,calc(100% - 24px));border-radius:22px;background:#1b1650ee;backdrop-filter:blur(16px);border:1px solid #ffffff2a;box-shadow:0 10px 40px #000a;color:#eef}
#pl .bar{display:flex;align-items:center;gap:10px;padding:10px 14px;flex-wrap:wrap}.th{width:46px;height:46px;border-radius:12px;object-fit:cover;background:var(--pu)}.pi{width:170px;min-width:0}.pi b,.pi small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ctl{display:flex;gap:2px;align-items:center}.ctl button,#pl .bar>button,.vl button{width:36px;height:36px;border-radius:50%;font-size:16px;color:#eef}.ctl button.a{color:var(--li)}.ctl .big{background:linear-gradient(135deg,var(--pu),var(--bl));width:44px;height:44px}
.sk{flex:1;display:flex;gap:8px;align-items:center;min-width:150px}.sk input{flex:1}.sk small{color:#c8c5f0}.vl{display:flex;align-items:center;gap:4px}.vl input{width:80px}
#pls{max-height:0;overflow:hidden;transition:.3s;padding:0 14px}.ex #pls{max-height:62vh;overflow:auto;padding:0 14px 14px}#pls #pp{width:min(320px,100%);aspect-ratio:16/9;border-radius:12px;display:block;margin-bottom:8px}

 if(!/^https:\/\/[a-z0-9-]+\.supabase\.co$/.test(u)){SBERR='SUPABASE_URL tidak valid (contoh: https://abcd1234.supabase.co)';return no}
 if(!k){SBERR='SUPABASE_ANON_KEY kosong';return no}
 if(/^sb_secret_/.test(k)){SBERR='DITOLAK: itu secret key (rahasia). Pakai anon/public key saja.';return no}
